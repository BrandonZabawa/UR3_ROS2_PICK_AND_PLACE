name: Bug
description: Something that does not work as expected
title: "[BUG] short description"
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour (include logs)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, ROS distro, Gazebo version, board/firmware version
